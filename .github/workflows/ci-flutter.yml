# TK ForgeWorks standard: Flutter CI validation.
#
# Validated by lazy-sleeper-app (first adopter, LS-39 PR #1, 2026-08-28):
# passed unchanged, ~1m25s–2m05s on ubuntu-latest with a pinned
# flutter-version. Also runs as a *nested* reusable: release-flutter.yml
# calls it as the release gate, so a repo's ci.yml and release.yml should
# pass the same flutter-version.
#
# Consume from a Flutter repo's CI workflow:
#
#   jobs:
#     ci:
#       uses: tkforgeworks/.github/.github/workflows/ci-flutter.yml@main
#       with:
#         flutter-version: '3.47.2'   # pin it; empty = latest stable
#
# Contract: `dart format`, `flutter analyze`, and `flutter test` must all pass
# from the repo root. Note `dart format` does not honour
# analysis_options.yaml excludes — any .dart file in the repo (docs/ included)
# must be formatted. Builds are intentionally NOT part of CI here — platform
# builds belong to release-flutter.yml.

name: Flutter CI

on:
  workflow_call:
    inputs:
      runs-on:
        description: 'Runner label'
        required: false
        type: string
        default: 'ubuntu-latest'
      flutter-version:
        description: 'Flutter SDK version (exact, or e.g. 3.x); empty = latest stable'
        required: false
        type: string
        default: ''
      flutter-channel:
        required: false
        type: string
        default: 'stable'
      working-directory:
        description: 'Path to the Flutter project if not the repo root'
        required: false
        type: string
        default: '.'

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ${{ inputs.runs-on }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter-version }}
          channel: ${{ inputs.flutter-channel }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format check
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
