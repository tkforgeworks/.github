# TK ForgeWorks standard: Flutter CI validation. *** STUB — UNVALIDATED ***
#
# Authored ahead of the first Flutter repo (lazy-sleeper-app) so that its
# first story lands on the shared workflow instead of a hand-rolled one.
# No adopter has run this yet. Expect to adjust when `flutter create` fixes
# the real project layout (Flutter SDK channel/version, whether a
# pubspec.lock is committed, integration-test needs, platform toolchains).
#
# Consume from a Flutter repo's CI workflow:
#
#   jobs:
#     ci:
#       uses: tkforgeworks/.github/.github/workflows/ci-flutter.yml@main
#       with:
#         flutter-version: '3.x'
#
# Contract: `dart format`, `flutter analyze`, and `flutter test` must all pass
# from the repo root. Builds are intentionally NOT part of CI here — platform
# builds (web/desktop/mobile) belong to a release workflow once one exists.

name: Flutter CI

on:
  workflow_call:
    inputs:
      runs-on:
        description: 'Runner label'
        required: false
        type: string
        default: 'ubuntu-latest'
      flutter-version:
        description: 'Flutter SDK version (exact, or e.g. 3.x); empty = latest stable'
        required: false
        type: string
        default: ''
      flutter-channel:
        required: false
        type: string
        default: 'stable'
      working-directory:
        description: 'Path to the Flutter project if not the repo root'
        required: false
        type: string
        default: '.'

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ${{ inputs.runs-on }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter-version }}
          channel: ${{ inputs.flutter-channel }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format check
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
